<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ma Ligue Discord - Ligue 1</title>

  <!-- FIREBASE (Optionnel) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #020617;
      color: white;
      min-height: 100vh;
    }

    /* BARRE DÉFILANTE */
    .announcement-bar {
      width: 100%;
      background: #111;
      color: white;
      overflow: hidden;
      white-space: nowrap;
      padding: 12px 0;
      border-bottom: 2px solid #38bdf8;
      font-weight: bold;
      font-size: 15px;
    }

    .announcement-text {
      display: inline-block;
      padding-left: 100%;
      animation: scrollText 18s linear infinite;
    }

    @keyframes scrollText {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    header {
      text-align: center;
      padding: 20px;
      font-size: 30px;
      background: #020617;
      font-weight: bold;
    }

    .container {
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* GRID DES CLUBS */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
    }

    /* CLUB CARD */
    .club {
      background: #1e293b;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      transition: transform .3s ease, background-color .3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .club:hover {
      transform: scale(1.05);
      background: #334155;
    }

    .club img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      transition: transform 0.3s ease;
    }

    .club:hover img {
      transform: scale(1.2);
    }

    .club-name {
      font-weight: bold;
      font-size: 16px;
    }

    /* BADGES V / N / D */
    .details {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
      margin-top: 5px;
      min-height: 24px;
    }

    .result {
      padding: 4px 8px;
      border-radius: 5px;
      font-weight: bold;
      font-size: 12px;
      color: white;
    }

    .V { background: #22c55e; } /* Vert */
    .N { background: #eab308; color: black; } /* Jaune */
    .D { background: #ef4444; } /* Rouge */

    /* LOGO LIGUE 1 EN FOND */
    .logo-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -10;
      pointer-events: none;
    }

    .logo-bg img {
      position: absolute;
      width: 350px;
      opacity: 0.07;
      animation: moveLogo 12s linear infinite;
    }

    @keyframes moveLogo {
      0%   { top: 10%; left: 10%; }
      25%  { top: 60%; left: 20%; }
      50%  { top: 30%; left: 70%; }
      75%  { top: 70%; left: 50%; }
      100% { top: 10%; left: 10%; }
    }
  </style>
</head>

<body>

  <!-- BARRE DÉFILANTE -->
  <div class="announcement-bar">
    <div class="announcement-text">
      🔥 Bienvenue sur la Ligue Manager • LA SAISON COMMENCE BIENTÔT • Bonne chance à tous les présidents 🔥
    </div>
  </div>

  <header>⚽ LIGUE 1 DISCORD ⚽</header>

  <!-- LOGO LIGUE 1 ANIMÉ EN FOND -->
  <div class="logo-bg">
    <img src="https://assets.football-logos.cc/logos/france/512x512/ligue-1--white.4072671a.png" alt="Ligue 1 Background">
  </div>

  <div class="container">
    <h2>Équipes de Ligue 1</h2>
    <div class="grid" id="ligue1Container"></div>
  </div>

  <script>
    // Ajoute ici tes V, N, D dans "form" pour chaque club (ex: ['V', 'N', 'D'])
    const clubsData = [
      { name: 'RC Lens', logo: 'https://assets.football-logos.cc/logos/france/512x512/rc-lens.5370d47c.png', form: ['V', 'N', 'D'] },
      { name: 'Stade Brestois', logo: 'https://assets.football-logos.cc/logos/france/1500x1500/brest.b0b54212.png', form: ['V', 'V'] },
      { name: 'AS Monaco', logo: 'https://assets.football-logos.cc/logos/france/700x700/as-monaco.b63e9cff.png', form: ['D'] },
      { name: 'Stade Rennais', logo: 'https://assets.football-logos.cc/logos/france/1500x1500/rennes.f07dde44.png', form: [] },
      { name: 'Le Havre AC', logo: 'https://assets.football-logos.cc/logos/france/512x512/le-havre-ac.1950fe12.png', form: [] },
      { name: 'Paris FC', logo: 'https://assets.football-logos.cc/logos/france/512x512/paris-fc.63e29830.png', form: [] },
      { name: 'Stade de Reims', logo: 'https://assets.football-logos.cc/logos/france/512x512/stade-de-reims.183c72e3.png', form: [] },
      { name: 'ESTAC Troyes', logo: 'https://assets.footylogos.com/previews/troyes/troyes-logo-footylogos-1200.webp', form: [] },
      { name: 'Olympique de Marseille', logo: 'https://assets.football-logos.cc/logos/france/512x512/marseille.f89278df.png', form: [] },
      { name: 'Le Mans', logo: 'https://assets.football-logos.cc/logos/france/512x512/le-mans.103d37a2.png', form: [] },
      { name: 'Lorient', logo: 'https://assets.football-logos.cc/logos/france/512x512/lorient.7dde32cc.png', form: [] },
      { name: 'LOSC Lille', logo: 'https://assets.football-logos.cc/logos/france/512x512/lille.71772c6d.png', form: [] },
      { name: 'Olympique Lyonnais', logo: 'https://assets.football-logos.cc/logos/france/1500x1500/lyon.05fe1f9a.png', form: [] },
      { name: 'RC Strasbourg', logo: 'https://assets.football-logos.cc/logos/france/512x512/rc-strasbourg-alsace.58bd7116.png', form: [] },
      { name: 'Angers SCO', logo: 'https://assets.football-logos.cc/logos/france/512x512/angers.bb65fb9c.png', form: [] },
      { name: 'Paris Saint-Germain', logo: 'https://assets.football-logos.cc/logos/france/1500x1500/paris-saint-germain.3259f37e.png', form: [] },
      { name: 'Toulouse FC', logo: 'https://assets.football-logos.cc/logos/france/512x512/toulouse.b40bb3e2.png', form: [] },
      { name: 'OGC Nice', logo: 'https://assets.football-logos.cc/logos/france/512x512/nice.be285080.png', form: [] }
    ];

    function renderClubs() {
      const container = document.getElementById('ligue1Container');
      container.innerHTML = '';

      clubsData.forEach(club => {
        const clubCard = document.createElement('div');
        clubCard.className = 'club';

        const detailsHtml = club.form.map(r => `<span class="result ${r}">${r}</span>`).join('');

        clubCard.innerHTML = `
          <img src="${club.logo}" alt="${club.name}">
          <div class="club-name">${club.name}</div>
          <div class="details">${detailsHtml}</div>
        `;

        container.appendChild(clubCard);
      });
    }

    renderClubs();
  </script>

</body>
</html>
