<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ma Ligue Discord - Ligue 1</title>

  <!-- FIREBASE (Optionnel) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <style>
    /* =========================================================
       1. STYLES GÉNÉRAUX & PAGE
       ========================================================= */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #020617;
      color: white;
      min-height: 100vh;
    }

    /* BARRE DÉFILANTE */
    .announcement-bar {
      width: 100%;
      background: #111;
      color: white;
      overflow: hidden;
      white-space: nowrap;
      padding: 12px 0;
      border-bottom: 2px solid #38bdf8;
      font-weight: bold;
      font-size: 15px;
    }

    .announcement-text {
      display: inline-block;
      padding-left: 100%;
      animation: scrollText 18s linear infinite;
    }

    @keyframes scrollText {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    header {
      text-align: center;
      padding: 20px;
      font-size: 30px;
      background: #020617;
      font-weight: bold;
    }

    .container {
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* BARRE DE RECHERCHE */
    .search-box {
      width: 100%;
      max-width: 400px;
      margin: 0 auto 30px auto;
      display: block;
      padding: 12px 20px;
      border-radius: 25px;
      border: 2px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .search-box:focus {
      border-color: #38bdf8;
    }

    /* =========================================================
       2. CARTES DES CLUBS (GRID)
       ========================================================= */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
    }

    .club {
      background: #1e293b;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      transition: transform .3s ease, background-color .3s ease, border-color .3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .club:hover {
      transform: translateY(-5px) scale(1.03);
      background: #334155;
      border-color: #38bdf8;
    }

    .club img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      transition: transform 0.3s ease;
    }

    .club:hover img {
      transform: scale(1.15);
    }

    .club-name {
      font-weight: bold;
      font-size: 16px;
    }

    /* BADGES DES RÉSULTATS (V / N / D) */
    .details {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
      margin-top: 5px;
      min-height: 24px;
    }

    .result {
      padding: 4px 8px;
      border-radius: 5px;
      font-weight: bold;
      font-size: 12px;
      color: white;
    }

    .V { background: #22c55e; } /* Vert */
    .N { background: #eab308; color: black; } /* Jaune */
    .D { background: #ef4444; } /* Rouge */

    /* LOGO FOND ANIMÉ */
    .logo-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -10;
      pointer-events: none;
    }

    .logo-bg img {
      position: absolute;
      width: 350px;
      opacity: 0.07;
      animation: moveLogo 12s linear infinite;
    }

    @keyframes moveLogo {
      0%   { top: 10%; left: 10%; }
      25%  { top: 60%; left: 20%; }
      50%  { top: 30%; left: 70%; }
      75%  { top: 70%; left: 50%; }
      100% { top: 10%; left: 10%; }
    }

    /* =========================================================
       3. FENÊTRE POP-UP (MODAL)
       ========================================================= */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: #0f172a;
      border: 2px solid #38bdf8;
      border-radius: 20px;
      padding: 30px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      position: relative;
      animation: popIn 0.3s ease;
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 20px;
      cursor: pointer;
    }

    .modal-logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    .modal-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .modal-info {
      background: #1e293b;
      padding: 12px;
      border-radius: 10px;
      margin: 10px 0;
      font-size: 14px;
    }

    .modal-stats {
      display: flex;
      justify-content: space-around;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #334155;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
    }

    .stat-value {
      font-size: 18px;
      font-weight: bold;
      color: #38bdf8;
    }

    .stat-label {
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <!-- BARRE DÉFILANTE -->
  <div class="announcement-bar">
    <div class="announcement-text">
      🔥 Bienvenue sur la Ligue Manager • LA SAISON COMMENCE BIENTÔT • Bonne chance à tous les présidents 🔥
    </div>
  </div>

  <header>⚽ LIGUE 1 DISCORD ⚽</header>

  <!-- LOGO EN FOND -->
  <div class="logo-bg">
    <img src="https://assets.football-logos.cc/logos/france/512x512/ligue-1--white.4072671a.png" alt="Ligue 1 Background">
  </div>

  <div class="container">
    <!-- BARRE DE RECHERCHE -->
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Rechercher une équipe..." oninput="filterClubs()">

    <!-- GRILLE OÙ S'AFFICHENT LES CLUBS -->
    <div class="grid" id="ligue1Container"></div>
  </div>

  <!-- POP-UP MODAL (FICHE DU CLUB) -->
  <div class="modal-overlay" id="clubModal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="close-btn" onclick="closeModal()">✖</button>
      <img id="mLogo" class="modal-logo" src="" alt="">
      <div id="mTitle" class="modal-title"></div>
      
      <div class="modal-info">
        👑 <b>Président :</b> <span id="mManager">Non attribué</span>
      </div>
      <div class="modal-info">
        💰 <b>Valeur Club :</b> <span id="mValue">100M €</span>
      </div>

      <div class="modal-stats">
        <div class="stat-box">
          <span class="stat-value" id="mPoints">0</span>
          <span class="stat-label">Points</span>
        </div>
        <div class="stat-box">
          <span class="stat-value" id="mWins">0</span>
          <span class="stat-label">Victoires</span>
        </div>
        <div class="stat-box">
          <span class="stat-value" id="mDraws">0</span>
          <span class="stat-label">Nuls</span>
        </div>
        <div class="stat-box">
          <span class="stat-value" id="mLosses">0</span>
          <span class="stat-label">Défaites</span>
        </div>
      </div>
    </div>
  </div>

  <!-- =========================================================
       JAVASCRIPT
       ========================================================= -->
  <script>
    /* ---------------------------------------------------------
       1. DONNÉES DES CLUBS ( MODIFIE TES ÉQUIPES ICI )
       ---------------------------------------------------------
       - name: Nom du club
       - logo: Lien d'image du logo
       - form: Rajoute 'V', 'N', ou 'D' entre les crochets (ex: ['V', 'V', 'N'])
       - manager: Nom du président / joueur Discord
       - value: Budget / Valeur du club
    --------------------------------------------------------- */
    const clubsData = [
      { name: 'RC Lens',               logo: 'https://assets.football-logos.cc/logos/france/512x512/rc-lens.5370d47c.png',            form: [], manager: 'Non attribué', value: '100M €' },
      { name: 'Stade Brestois',        logo: 'https://assets.football-logos.cc/logos/france/1500x1500/brest.b0b54212.png',           form: [], manager: 'Non attribué', value: '100M €' },
      { name: 'AS Monaco',             logo: 'https://assets.football-logos.cc/logos/france/700x700/as-monaco.b63e9cff.png',          form: [], manager: 'Non attribué', value: '100M €' },
      { name: 'Stade Rennais',         logo: 'https://assets.football-logos.cc/logos/france/1500x1500/rennes.f07dde44.png',          form: [], manager: 'Non attribué', value: '100M €' },
      { name: 'Le Havre AC',           logo: 'https://assets.football-logos.cc/logos/france/512x512/le-havre-ac.1950fe12.png',        form: [], manager: 'Non attribué', value: '100M €' },
      { name: 'Paris FC',              logo: 'https://assets.football-logos.cc/logos/france/512x512/paris-fc.63e29830.png',           form: [], manager: 'Non attribué', value: '100M €' },
      { name: 'Stade de Reims',        logo: 'https://assets.football-logos.cc/logos/france/512x512/stade-de-reims.183c72e3.png',     form: [], manager: 'Non attribué', value: '100M €' },
      { name: 'ESTAC Troyes',          logo: 'https://assets.footylogos.com/previews/troyes/troyes-logo-footylogos-1200.webp',        form: [], manager: 'Non attribué', value: '100M €' },
      { name: 'Olympique de Marseille', logo: 'https://assets.football-logos.cc/logos/france/512x512/marseille.f89278df.png',        form: [], manager: 'Non attribué', value: '100M €' },
      { name: 'Le Mans',               logo: 'https://assets.football-logos.cc/logos/france/512x512/le-mans.103d37a2.png',           form: [], manager: 'Non attribué', value: '100M €' },
      { name: 'Lorient',               logo: 'https://assets.football-logos.cc/logos/france/512x512/lorient.7dde32cc.png',           form: [], manager: 'Non attribué', value: '100M €' },
      { name: 'LOSC Lille',            logo: 'https://assets.football-logos.cc/logos/france/512x512/lille.71772c6d.png',             form: [], manager: 'Non attribué', value: '100M €' },
      { name: 'Olympique Lyonnais',    logo: 'https://assets.football-logos.cc/logos/france/1500x1500/lyon.05fe1f9a.png',             form: [], manager: 'Non attribué', value: '100M €' },
      { name: 'RC Strasbourg',         logo: 'https://assets.football-logos.cc/logos/france/512x512/rc-strasbourg-alsace.58bd7116.png', form: [], manager: 'Non attribué', value: '100M €' },
      { name: 'Angers SCO',            logo: 'https://assets.football-logos.cc/logos/france/512x512/angers.bb65fb9c.png',            form: [], manager: 'Non attribué', value: '100M €' },
      { name: 'Paris Saint-Germain',   logo: 'https://assets.football-logos.cc/logos/france/1500x1500/paris-saint-germain.3259f37e.png', form: [], manager: 'Non attribué', value: '100M €' },
      { name: 'Toulouse FC',           logo: 'https://assets.football-logos.cc/logos/france/512x512/toulouse.b40bb3e2.png',          form: [], manager: 'Non attribué', value: '100M €' },
      { name: 'OGC Nice',              logo: 'https://assets.football-logos.cc/logos/france/512x512/nice.be285080.png',              form: [], manager: 'Non attribué', value: '100M €' }
    ];

    /* ---------------------------------------------------------
       2. FONCTIONS DE RENDU (AFFICHAGE)
       --------------------------------------------------------- */
    function renderClubs(filteredList = clubsData) {
      const container = document.getElementById('ligue1Container');
      container.innerHTML = '';

      filteredList.forEach((club) => {
        const clubCard = document.createElement('div');
        clubCard.className = 'club';
        clubCard.onclick = () => openModal(club);

        const detailsHtml = club.form.map(r => `<span class="result ${r}">${r}</span>`).join('');

        clubCard.innerHTML = `
          <img src="${club.logo}" alt="${club.name}">
          <div class="club-name">${club.name}</div>
          <div class="details">${detailsHtml}</div>
        `;

        container.appendChild(clubCard);
      });
    }

    // Filtrer la liste avec la recherche
    function filterClubs() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = clubsData.filter(club => club.name.toLowerCase().includes(query));
      renderClubs(filtered);
    }

    /* ---------------------------------------------------------
       3. FONCTIONS MODAL (POP-UP & STATISTIQUES)
       --------------------------------------------------------- */
    function openModal(club) {
      document.getElementById('mLogo').src = club.logo;
      document.getElementById('mTitle').innerText = club.name;
      document.getElementById('mManager').innerText = club.manager || 'Non attribué';
      document.getElementById('mValue').innerText = club.value || 'N/A';

      // Calcul automatique des points
      const wins = club.form.filter(r => r === 'V').length;
      const draws = club.form.filter(r => r === 'N').length;
      const losses = club.form.filter(r => r === 'D').length;
      const points = (wins * 3) + (draws * 1);

      document.getElementById('mWins').innerText = wins;
      document.getElementById('mDraws').innerText = draws;
      document.getElementById('mLosses').innerText = losses;
      document.getElementById('mPoints').innerText = points;

      document.getElementById('clubModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('clubModal').classList.remove('active');
    }

    // Lancement au chargement de la page
    renderClubs();
  </script>

</body>
</html>
