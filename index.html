<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ma Ligue Discord - Ligue 1</title>

  <style>
    /* =========================================================
       1. STYLES GÉNÉRAUX & PAGE
       ========================================================= */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #020617;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* BARRE DÉFILANTE */
    .announcement-bar {
      width: 100%;
      background: #111;
      color: white;
      overflow: hidden;
      white-space: nowrap;
      padding: 12px 0;
      border-bottom: 2px solid #38bdf8;
      font-weight: bold;
      font-size: 15px;
    }

    .announcement-text {
      display: inline-block;
      padding-left: 100%;
      animation: scrollText 18s linear infinite;
    }

    @keyframes scrollText {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    header {
      text-align: center;
      padding: 20px;
      font-size: 30px;
      background: #020617;
      font-weight: bold;
    }

    /* BARRE DE NAVIGATION (TABS) */
    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .nav-btn {
      background: #1e293b;
      color: white;
      border: 1px solid #334155;
      padding: 10px 24px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav-btn:hover {
      background: #334155;
      border-color: #38bdf8;
    }

    .nav-btn.active {
      background: #38bdf8;
      color: #020617;
      border-color: #38bdf8;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .container {
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* BARRE DE RECHERCHE ET SÉLECTEURS */
    .search-box, .select-box {
      width: 100%;
      max-width: 400px;
      margin: 0 auto 30px auto;
      display: block;
      padding: 12px 20px;
      border-radius: 25px;
      border: 2px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s ease;
      text-align-last: center;
    }

    .search-box:focus, .select-box:focus {
      border-color: #38bdf8;
    }

    /* =========================================================
       2. CARTES DES CLUBS (GRID)
       ========================================================= */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
    }

    .club {
      background: #1e293b;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      transition: transform .3s ease, background-color .3s ease, border-color .3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .club:hover {
      transform: translateY(-5px) scale(1.03);
      background: #334155;
      border-color: #38bdf8;
    }

    .club img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      transition: transform 0.3s ease;
    }

    .club:hover img {
      transform: scale(1.15);
    }

    .club-name {
      font-weight: bold;
      font-size: 16px;
    }

    /* BADGES DES RÉSULTATS (V / N / D) */
    .details {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
      margin-top: 5px;
      min-height: 24px;
    }

    .result {
      padding: 4px 8px;
      border-radius: 5px;
      font-weight: bold;
      font-size: 12px;
      color: white;
    }

    .V { background: #22c55e; }
    .N { background: #eab308; color: black; }
    .D { background: #ef4444; }

    /* =========================================================
       3. STYLES DU CALENDRIER & MATCHS
       ========================================================= */
    .matches-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 800px;
      margin: 0 auto;
    }

    .match-card {
      background: #1e293b;
      border-radius: 15px;
      padding: 15px 25px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 15px;
      border: 1px solid #334155;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.3s ease, background-color 0.2s ease;
    }

    .match-card:hover {
      border-color: #38bdf8;
      background: #334155;
      transform: translateY(-2px);
    }

    .team-side {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: bold;
      font-size: 16px;
    }

    .team-side.home {
      justify-content: flex-end;
      text-align: right;
    }

    .team-side.away {
      justify-content: flex-start;
      text-align: left;
    }

    .team-side img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .score-box {
      background: #0f172a;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 18px;
      color: #38bdf8;
      border: 1px solid #334155;
      min-width: 60px;
      text-align: center;
    }

    .match-status {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* LOGOS DE FOND (ANIMATION PHYSIQUE CONTINUED) */
    .logo-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -10;
      pointer-events: none;
    }

    .bouncing-logo {
      position: absolute;
      width: 180px;
      height: 180px;
      object-fit: contain;
      opacity: 0.08;
    }

    /* =========================================================
       4. FENÊTRES POP-UP (MODALS)
       ========================================================= */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: #0f172a;
      border: 2px solid #38bdf8;
      border-radius: 20px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      text-align: center;
      position: relative;
      max-height: 85vh;
      overflow-y: auto;
      animation: popIn 0.3s ease;
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 20px;
      cursor: pointer;
    }

    .modal-logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    .modal-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .modal-info {
      background: #1e293b;
      padding: 12px;
      border-radius: 10px;
      margin: 10px 0;
      font-size: 14px;
    }

    .manager-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .action-btn {
      width: 100%;
      background: #38bdf8;
      border: none;
      color: #020617;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin: 10px 0;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .action-btn:hover { background: #7dd3fc; }
    .action-btn:active { transform: scale(0.98); }

    .copy-btn {
      background: #38bdf8;
      border: none;
      color: #020617;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      white-space: nowrap;
    }

    .copy-btn:hover { background: #7dd3fc; }
    .copy-btn:active { transform: scale(0.95); }

    .modal-stats {
      display: flex;
      justify-content: space-around;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #334155;
    }

    .stat-box { display: flex; flex-direction: column; }
    .stat-value { font-size: 18px; font-weight: bold; color: #38bdf8; }
    .stat-label { font-size: 12px; color: #94a3b8; }

    /* STYLES MODAL EFFECTIF */
    .squad-section {
      text-align: left;
      margin-bottom: 15px;
      background: #1e293b;
      padding: 12px 15px;
      border-radius: 10px;
    }

    .squad-section-title {
      color: #38bdf8;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 8px;
      border-bottom: 1px solid #334155;
      padding-bottom: 4px;
    }

    .squad-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 6px;
      font-size: 13px;
    }

    .squad-player {
      background: #0f172a;
      padding: 6px 10px;
      border-radius: 6px;
      color: #e2e8f0;
      border: 1px solid #334155;
    }

    /* STYLES MODAL MATCH (STATS DU MATCH) */
    .match-header-modal {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #334155;
    }

    .team-modal-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-weight: bold;
      font-size: 14px;
    }

    .team-modal-side img {
      width: 50px;
      height: 50px;
      object-fit: contain;
    }

    .score-modal-box {
      font-size: 26px;
      font-weight: bold;
      color: #38bdf8;
      background: #1e293b;
      padding: 8px 18px;
      border-radius: 12px;
      border: 1px solid #334155;
    }

    /* BUTS & PASSEURS */
    .goals-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      background: #1e293b;
      padding: 12px;
      border-radius: 10px;
      font-size: 12px;
      margin-bottom: 15px;
      text-align: left;
    }

    .goals-home { text-align: left; }
    .goals-away { text-align: right; }

    .goal-item { margin-bottom: 6px; }
    .assist-item { color: #94a3b8; font-size: 11px; font-style: italic; }

    /* HOMME DU MATCH */
    .motm-box {
      background: #1e293b;
      border: 1px solid #eab308;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 20px;
      font-size: 13px;
      text-align: center;
    }

    .motm-title {
      color: #eab308;
      font-weight: bold;
      margin-bottom: 3px;
    }

    .motm-desc {
      color: #94a3b8;
      font-size: 11px;
      font-style: italic;
    }

    /* LIGNES STATISTIQUES */
    .stat-row {
      margin-bottom: 12px;
    }

    .stat-row-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 4px;
      font-weight: bold;
    }

    .stat-title { color: #94a3b8; font-size: 12px; }

    .bar-container {
      height: 8px;
      background: #1e293b;
      border-radius: 4px;
      display: flex;
      overflow: hidden;
    }

    .bar-home { background: #38bdf8; height: 100%; }
    .bar-away { background: #ef4444; height: 100%; }
  </style>
</head>

  <script>
    /* ---------------------------------------------------------
       1. ANIMATION PHYSIQUE DES LOGOS (REBOND CONTINU)
       --------------------------------------------------------- */
    const logos = [
      { id: 'logo1', x: 50, y: 50, dx: 1.5, dy: 1.2 },
      { id: 'logo2', x: 300, y: 200, dx: -1.2, dy: 1.6 },
      { id: 'logo3', x: 600, y: 100, dx: 1.4, dy: -1.3 }
    ];

    function animateLogos() {
      const width = window.innerWidth - 180;
      const height = window.innerHeight - 180;

      logos.forEach(l => {
        let el = document.getElementById(l.id);
        if (el) {
          l.x += l.dx;
          l.y += l.dy;

          if (l.x <= 0 || l.x >= width) l.dx *= -1;
          if (l.y <= 0 || l.y >= height) l.dy *= -1;

          el.style.transform = `translate(${l.x}px, ${l.y}px)`;
        }
      });

      requestAnimationFrame(animateLogos);
    }

      animateLogos();

    /* ---------------------------------------------------------
       4. NAVIGATION ONGLETS
       --------------------------------------------------------- */
    function switchTab(tabName, evt) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

      if (tabName === 'clubs') {
        document.getElementById('tab-clubs').classList.add('active');
        if (evt) evt.target.classList.add('active');
      } else if (tabName === 'calendar') {
        document.getElementById('tab-calendar').classList.add('active');
        if (evt) evt.target.classList.add('active');
        renderMatches();
      }
    }

    /* ---------------------------------------------------------
       5. RENDU DU CALENDRIER & AFFICHAGE MATCH
       --------------------------------------------------------- */
    function renderMatches() {
      const selectedDay = document.getElementById('daySelect').value;
      const container = document.getElementById('matchesContainer');
      container.innerHTML = '';

      const dayMatches = matchesData[selectedDay] || [];

      if (dayMatches.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: #94a3b8; padding: 40px 0;">Les affiches de cette journée seront bientôt programmées !</div>';
        return;
      }

      dayMatches.forEach(match => {
        const homeClub = clubsData.find(c => c.name === match.home) || { logo: '', name: match.home };
        const awayClub = clubsData.find(c => c.name === match.away) || { logo: '', name: match.away };

        const scoreText = (match.scoreHome !== null && match.scoreAway !== null)
          ? `${match.scoreHome} - ${match.scoreAway}`
          : 'VS';

        const matchCard = document.createElement('div');
        matchCard.className = 'match-card';
        matchCard.onclick = () => openMatchModal(match);

        matchCard.innerHTML = `
          <div class="team-side home">
            <span>${homeClub.name}</span>
            <img src="${homeClub.logo}" alt="${homeClub.name}">
          </div>
          <div style="text-align: center;">
            <div class="score-box">${scoreText}</div>
            <div class="match-status">${match.status}</div>
          </div>
          <div class="team-side away">
            <img src="${awayClub.logo}" alt="${awayClub.name}">
            <span>${awayClub.name}</span>
          </div>
        `;
        container.appendChild(matchCard);
      });
    }

    /* ---------------------------------------------------------
       6. GESTION DU MODAL STATISTIQUES MATCH
       --------------------------------------------------------- */
    function openMatchModal(match) {
      const homeClub = clubsData.find(c => c.name === match.home) || { logo: '', name: match.home };
      const awayClub = clubsData.find(c => c.name === match.away) || { logo: '', name: match.away };

      document.getElementById('matchHomeLogo').src = homeClub.logo;
      document.getElementById('matchHomeName').innerText = homeClub.name;
      document.getElementById('matchAwayLogo').src = awayClub.logo;
      document.getElementById('matchAwayName').innerText = awayClub.name;

      const scoreText = (match.scoreHome !== null && match.scoreAway !== null) ? `${match.scoreHome} - ${match.scoreAway}` : 'VS';
      document.getElementById('matchScoreModal').innerText = scoreText;
      document.getElementById('matchStatusModal').innerText = match.status;

      // Render Buteurs
      const goalsHome = document.getElementById('goalsHome');
      const goalsAway = document.getElementById('goalsAway');
      goalsHome.innerHTML = '';
      goalsAway.innerHTML = '';

      if (match.goalsHome && match.goalsHome.length > 0) {
        match.goalsHome.forEach(g => {
          goalsHome.innerHTML += `<div class="goal-item">⚽ <b>${g.name}</b>${g.assist ? `<br><span class="assist-item">👟 Passe: ${g.assist}</span>` : ''}</div>`;
        });
      }

      if (match.goalsAway && match.goalsAway.length > 0) {
        match.goalsAway.forEach(g => {
          goalsAway.innerHTML += `<div class="goal-item">⚽ <b>${g.name}</b>${g.assist ? `<br><span class="assist-item">👟 Passe: ${g.assist}</span>` : ''}</div>`;
        });
      }

      // Render Homme du Match
      const motmBox = document.getElementById('motmBox');
      if (match.motm) {
        document.getElementById('motmTitle').innerText = '⭐ Homme du match : ' + match.motm;
        document.getElementById('motmDesc').innerText = match.motmDesc || '';
        motmBox.style.display = 'block';
      } else {
        motmBox.style.display = 'none';
      }

      // Render Statistiques
      const statsList = document.getElementById('statsList');
      statsList.innerHTML = '';

      if (match.stats) {
        const labels = {
          xg: 'Expected Goals (xG)',
          shots: 'Tirs au but',
          shotsOnTarget: 'Tirs cadrés',
          possession: 'Possession (%)',
          passes: 'Passes réussies',
          fouls: 'Fautes commises',
          red: 'Cartons rouges'
        };

        Object.keys(match.stats).forEach(key => {
          const valHome = match.stats[key][0];
          const valAway = match.stats[key][1];
          const total = (parseFloat(valHome) + parseFloat(valAway)) || 1;
          const pctHome = Math.round((parseFloat(valHome) / total) * 100);
          const pctAway = 100 - pctHome;

          statsList.innerHTML += `
            <div class="stat-row">
              <div class="stat-row-header">
                <span>${valHome}</span>
                <span class="stat-title">${labels[key]}</span>
                <span>${valAway}</span>
              </div>
              <div class="bar-container">
                <div class="bar-home" style="width: ${pctHome}%;"></div>
                <div class="bar-away" style="width: ${pctAway}%;"></div>
              </div>
            </div>
          `;
        });
      } else {
        statsList.innerHTML = '<div style="color: #94a3b8; font-size: 13px; margin-top: 15px;">Les statistiques détaillées ne sont pas disponibles pour ce match.</div>';
      }

      document.getElementById('matchModal').classList.add('active');
    }

    /* ---------------------------------------------------------
       7. RENDU DES CLUBS & POP-UP CLUB / EFFECTIF
       --------------------------------------------------------- */
    function renderClubs(clubsToRender) {
      const container = document.getElementById('ligue1Container');
      container.innerHTML = '';

      clubsToRender.forEach(club => {
        // TOUT l'historique compte pour les points
        let wins = club.form.filter(r => r === 'V').length;
        let draws = club.form.filter(r => r === 'N').length;
        let losses = club.form.filter(r => r === 'D').length;
        let points = (wins * 3) + draws;

        const clubDiv = document.createElement('div');
        clubDiv.className = 'club';
        clubDiv.onclick = () => openClubModal(club, points, wins, draws, losses);

        // Seuls les 5 DERNIERS résultats sont affichés dans les badges
        let displayForm = club.form.slice(-5);
        let formHTML = displayForm.map(r => `<span class="result ${r}">${r}</span>`).join('');

        clubDiv.innerHTML = `
          <img src="${club.logo}" alt="${club.name}">
          <div class="club-name">${club.name}</div>
          <div class="details">${formHTML}</div>
        `;

        container.appendChild(clubDiv);
      });
    }

    function filterClubs() {
      const term = document.getElementById('searchInput').value.toLowerCase();
      const filtered = clubsData.filter(c => c.name.toLowerCase().includes(term));
      renderClubs(filtered);
    }

    function openClubModal(club, points, wins, draws, losses) {
      activeClub = club;
      document.getElementById('mLogo').src = club.logo;
      document.getElementById('mTitle').innerText = club.name;
      document.getElementById('mManager').innerText = club.manager;
      document.getElementById('mMonthBadges').innerText = club.monthBadges;
      document.getElementById('mPoints').innerText = points;
      document.getElementById('mWins').innerText = wins;
      document.getElementById('mDraws').innerText = draws;
      document.getElementById('mLosses').innerText = losses;

      activeContact = club.manager;
      document.getElementById('clubModal').classList.add('active');
    }

    function openSquadModal() {
      if (!activeClub) return;

      document.getElementById('squadLogo').src = activeClub.logo;
      document.getElementById('squadTitle').innerText = `Effectif - ${activeClub.name}`;

      const squadContainer = document.getElementById('squadContainer');
      squadContainer.innerHTML = '';

      const roles = [
        { key: 'gk', label: '🧤 Gardiens' },
        { key: 'def', label: '🛡️ Défenseurs' },
        { key: 'mid', label: '⚙️ Milieux' },
        { key: 'att', label: '⚡ Attaquants' }
      ];

      roles.forEach(role => {
        if (activeClub.squad && activeClub.squad[role.key] && activeClub.squad[role.key].length > 0) {
          const playersHTML = activeClub.squad[role.key]
            .map(p => `<div class="squad-player">${p}</div>`)
            .join('');

          squadContainer.innerHTML += `
            <div class="squad-section">
              <div class="squad-section-title">${role.label} (${activeClub.squad[role.key].length})</div>
              <div class="squad-list">${playersHTML}</div>
            </div>
          `;
        }
      });

      document.getElementById('squadModal').classList.add('active');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    function copyDiscordContact() {
      if (!activeContact || activeContact === 'Non attribué') {
        alert('Aucun contact Discord attribué à ce club pour le moment.');
        return;
      }
      navigator.clipboard.writeText(activeContact).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.innerText = '✅ Copié !';
        setTimeout(() => { btn.innerText = '📋 Copier contact'; }, 2000);
      });
    }

    /* INITIALISATION DE LA PAGE */
    renderClubs(clubsData);
  </script>
</body>
</html>
