<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ma Ligue Discord - Ligue 1</title>

  <style>
    /* =========================================================
       1. STYLES GÉNÉRAUX & PAGE
       ========================================================= */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #020617;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* BARRE DÉFILANTE */
    .announcement-bar {
      width: 100%;
      background: #111;
      color: white;
      overflow: hidden;
      white-space: nowrap;
      padding: 12px 0;
      border-bottom: 2px solid #38bdf8;
      font-weight: bold;
      font-size: 15px;
    }

    .announcement-text {
      display: inline-block;
      padding-left: 100%;
      animation: scrollText 18s linear infinite;
    }

    @keyframes scrollText {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    header {
      text-align: center;
      padding: 20px;
      font-size: 30px;
      background: #020617;
      font-weight: bold;
    }

    .container {
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* BARRE DE RECHERCHE */
    .search-box {
      width: 100%;
      max-width: 400px;
      margin: 0 auto 30px auto;
      display: block;
      padding: 12px 20px;
      border-radius: 25px;
      border: 2px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .search-box:focus {
      border-color: #38bdf8;
    }

    /* =========================================================
       2. CARTES DES CLUBS (GRID)
       ========================================================= */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
    }

    .club {
      background: #1e293b;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      transition: transform .3s ease, background-color .3s ease, border-color .3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .club:hover {
      transform: translateY(-5px) scale(1.03);
      background: #334155;
      border-color: #38bdf8;
    }

    .club img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      transition: transform 0.3s ease;
    }

    .club:hover img {
      transform: scale(1.15);
    }

    .club-name {
      font-weight: bold;
      font-size: 16px;
    }

    /* BADGES DES RÉSULTATS (V / N / D) */
    .details {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
      margin-top: 5px;
      min-height: 24px;
    }

    .result {
      padding: 4px 8px;
      border-radius: 5px;
      font-weight: bold;
      font-size: 12px;
      color: white;
    }

    .V { background: #22c55e; }
    .N { background: #eab308; color: black; }
    .D { background: #ef4444; }

    /* LOGOS DE FOND (ANIMATION PHYSIQUE) */
    .logo-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -10;
      pointer-events: none;
    }

    .bouncing-logo {
      position: absolute;
      width: 220px;
      height: 220px;
      object-fit: contain;
      opacity: 0.08;
    }

    /* =========================================================
       3. FENÊTRE POP-UP (MODAL)
       ========================================================= */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: #0f172a;
      border: 2px solid #38bdf8;
      border-radius: 20px;
      padding: 30px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      position: relative;
      animation: popIn 0.3s ease;
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 20px;
      cursor: pointer;
    }

    .modal-logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    .modal-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .modal-info {
      background: #1e293b;
      padding: 12px;
      border-radius: 10px;
      margin: 10px 0;
      font-size: 14px;
    }

    .modal-stats {
      display: flex;
      justify-content: space-around;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #334155;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
    }

    .stat-value {
      font-size: 18px;
      font-weight: bold;
      color: #38bdf8;
    }

    .stat-label {
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <div class="announcement-bar">
    <div class="announcement-text">
      🔥 Bienvenue sur la Ligue Manager • LA SAISON COMMENCE BIENTÔT • Bonne chance à tous les présidents 🔥
    </div>
  </div>

  <header>⚽ LIGUE 1 DISCORD ⚽</header>

  <!-- LOGOS REBONDISSANTS EN FOND -->
  <div class="logo-bg">
    <!-- Logo 1: Ligue 1 -->
    <img id="logo1" class="bouncing-logo" src="https://assets.football-logos.cc/logos/france/512x512/ligue-1--white.4072671a.png" alt="Ligue 1">
    <!-- Logo 2: LFP -->
    <img id="logo2" class="bouncing-logo" src="https://www.lfp.fr/_next/image?url=https%3A%2F%2Fwww.lfp.fr%2Fassets%2FLFP_e5d2655ef3.jpg&w=1920&q=75" alt="LFP">
  </div>

  <div class="container">
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Rechercher une équipe..." oninput="filterClubs()">
    <div class="grid" id="ligue1Container"></div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="clubModal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="close-btn" onclick="closeModal()">✖</button>
      <img id="mLogo" class="modal-logo" src="" alt="">
      <div id="mTitle" class="modal-title"></div>
      
      <div class="modal-info">
        👑 <b>Président :</b> <span id="mManager">Non attribué</span>
      </div>
      <div class="modal-info">
        🏆 <b>Équipe du mois :</b> <span id="mMonthBadges">0</span>
      </div>

      <div class="modal-stats">
        <div class="stat-box">
          <span class="stat-value" id="mPoints">0</span>
          <span class="stat-label">Points</span>
        </div>
        <div class="stat-box">
          <span class="stat-value" id="mWins">0</span>
          <span class="stat-label">Victoires</span>
        </div>
        <div class="stat-box">
          <span class="stat-value" id="mDraws">0</span>
          <span class="stat-label">Nuls</span>
        </div>
        <div class="stat-box">
          <span class="stat-value" id="mLosses">0</span>
          <span class="stat-label">Défaites</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ---------------------------------------------------------
       1. DONNÉES DES CLUBS
       --------------------------------------------------------- */
    const clubsData = [
      { name: 'Olympique de Marseille', logo: 'https://assets.football-logos.cc/logos/france/512x512/marseille.f89278df.png',        form: ['V', 'V', 'V', 'V', 'N', 'N'], manager: 'Non attribué', monthBadges: 1 },
      { name: 'RC Strasbourg',         logo: 'https://assets.football-logos.cc/logos/france/512x512/rc-strasbourg-alsace.58bd7116.png', form: ['V', 'V', 'V', 'V', 'N', 'N'], manager: 'Non attribué', monthBadges: 0 },
      { name: 'Paris Saint-Germain',   logo: 'https://assets.football-logos.cc/logos/france/1500x1500/paris-saint-germain.3259f37e.png', form: ['V', 'V', 'V', 'V', 'N', 'N'], manager: 'Non attribué', monthBadges: 0 },
      { name: 'Olympique Lyonnais',    logo: 'https://assets.football-logos.cc/logos/france/1500x1500/lyon.05fe1f9a.png',             form: ['V', 'V', 'V', 'V', 'N', 'D'], manager: 'Non attribué', monthBadges: 0 },
      { name: 'RC Lens',               logo: 'https://assets.football-logos.cc/logos/france/512x512/rc-lens.5370d47c.png',            form: ['V', 'V', 'V', 'N', 'N', 'D'], manager: 'Non attribué', monthBadges: 0 },
      { name: 'LOSC Lille',            logo: 'https://assets.football-logos.cc/logos/france/512x512/lille.71772c6d.png',             form: ['V', 'V', 'V', 'N', 'N', 'D'], manager: 'Non attribué', monthBadges: 0 },
      { name: 'AS Monaco',             logo: 'https://assets.football-logos.cc/logos/france/700x700/as-monaco.b63e9cff.png',          form: ['V', 'V', 'V', 'N', 'D', 'D'], manager: 'Non attribué', monthBadges: 0 },
      { name: 'Stade Rennais',         logo: 'https://assets.football-logos.cc/logos/france/1500x1500/rennes.f07dde44.png',          form: ['V', 'V', 'V', 'N', 'D', 'D'], manager: 'Non attribué', monthBadges: 0 },
      { name: 'Toulouse FC',           logo: 'https://assets.football-logos.cc/logos/france/512x512/toulouse.b40bb3e2.png',          form: ['V', 'V', 'V', 'D', 'D', 'D'], manager: 'Non attribué', monthBadges: 0 },
      { name: 'ESTAC Troyes',          logo: 'https://assets.footylogos.com/previews/troyes/troyes-logo-footylogos-1200.webp',        form: ['V', 'V', 'N', 'D', 'D', 'D'], manager: 'Non attribué', monthBadges: 0 },
      { name: 'Paris FC',              logo: 'https://assets.football-logos.cc/logos/france/512x512/paris-fc.63e29830.png',           form: ['V', 'V', 'D', 'D', 'D', 'D'], manager: 'Non attribué', monthBadges: 0 },
      { name: 'Angers SCO',            logo: 'https://assets.football-logos.cc/logos/france/512x512/angers.bb65fb9c.png',            form: ['V', 'V', 'D', 'D', 'D', 'D'], manager: 'Non attribué', monthBadges: 0 },
      { name: 'Le Mans',               logo: 'https://assets.football-logos.cc/logos/france/512x512/le-mans.103d37a2.png',           form: ['V', 'V', 'D', 'D', 'D', 'D'], manager: 'Non attribué', monthBadges: 0 },
      { name: 'Stade Brestois',        logo: 'https://assets.football-logos.cc/logos/france/1500x1500/brest.b0b54212.png',           form: ['V', 'V', 'D', 'D', 'D', 'D'], manager: 'Non attribué', monthBadges: 0 },
      { name: 'OGC Nice',              logo: 'https://assets.football-logos.cc/logos/france/512x512/nice.be285080.png',              form: ['V', 'N', 'N', 'D', 'D', 'D'], manager: 'Non attribué', monthBadges: 0 },
      { name: 'Le Havre AC',           logo: 'https://assets.football-logos.cc/logos/france/512x512/le-havre-ac.1950fe12.png',        form: ['V', 'N', 'D', 'D', 'D', 'D'], manager: 'Non attribué', monthBadges: 0 },
      { name: 'AJ Auxerre',            logo: 'https://assets.football-logos.cc/logos/france/512x512/aj-auxerre.84df3014.png',        form: ['V', 'N', 'D', 'D', 'D', 'D'], manager: 'Non attribué', monthBadges: 0 },
      { name: 'Lorient',               logo: 'https://assets.football-logos.cc/logos/france/512x512/lorient.7dde32cc.png',           form: ['V', 'D', 'D', 'D', 'D', 'D'], manager: 'Non attribué', monthBadges: 0 }
    ];

    /* ---------------------------------------------------------
       2. MOTEUR PHYSIQUE AVEC COLLISION ENTRE LOGOS (LIGUE 1 & LFP)
       --------------------------------------------------------- */
    const logos = [
      {
        el: document.getElementById('logo1'),
        x: 100,
        y: 100,
        vx: 1.5,
        vy: 1.2,
        size: 220
      },
      {
        el: document.getElementById('logo2'),
        x: window.innerWidth - 300,
        y: window.innerHeight - 300,
        vx: -1.3,
        vy: -1.4,
        size: 220
      }
    ];

    function updatePhysics() {
      const sw = window.innerWidth;
      const sh = window.innerHeight;

      // 1. Déplacement & rebonds sur les bords d'écran
      logos.forEach(l => {
        l.x += l.vx;
        l.y += l.vy;

        if (l.x <= 0 || l.x + l.size >= sw) {
          l.vx *= -1;
          l.x = Math.max(0, Math.min(l.x, sw - l.size));
        }
        if (l.y <= 0 || l.y + l.size >= sh) {
          l.vy *= -1;
          l.y = Math.max(0, Math.min(l.y, sh - l.size));
        }
      });

      // 2. Détection de la collision entre Ligue 1 et LFP
      const l1 = logos[0];
      const l2 = logos[1];

      const c1x = l1.x + l1.size / 2;
      const c1y = l1.y + l1.size / 2;
      const c2x = l2.x + l2.size / 2;
      const c2y = l2.y + l2.size / 2;

      const dx = c2x - c1x;
      const dy = c2y - c1y;
      const dist = Math.hypot(dx, dy);
      const minDist = l1.size * 0.85; // Rayon de collision effectif

      if (dist < minDist) {
        // Inversion des trajectoires (Rebond physique réaliste)
        const tempVx = l1.vx;
        const tempVy = l1.vy;
        l1.vx = l2.vx;
        l1.vy = l2.vy;
        l2.vx = tempVx;
        l2.vy = tempVy;

        // Anti-chevauchement (repousse les 2 logos pour qu'ils ne se coincent pas)
        const overlap = minDist - dist;
        const nx = dx / (dist || 1);
        const ny = dy / (dist || 1);

        l1.x -= nx * (overlap / 2);
        l1.y -= ny * (overlap / 2);
        l2.x += nx * (overlap / 2);
        l2.y += ny * (overlap / 2);
      }

      // 3. Mise à jour des positions HTML
      logos.forEach(l => {
        l.el.style.left = l.x + 'px';
        l.el.style.top = l.y + 'px';
      });

      requestAnimationFrame(updatePhysics);
    }

    requestAnimationFrame(updatePhysics);

    /* ---------------------------------------------------------
       3. FONCTIONS DE RENDU & MODAL
       --------------------------------------------------------- */
    function renderClubs(filteredList = clubsData) {
      const container = document.getElementById('ligue1Container');
      container.innerHTML = '';

      filteredList.forEach((club) => {
        const clubCard = document.createElement('div');
        clubCard.className = 'club';
        clubCard.onclick = () => openModal(club);

        const lastFiveForm = club.form.slice(-5);
        const detailsHtml = lastFiveForm.map(r => `<span class="result ${r}">${r}</span>`).join('');

        clubCard.innerHTML = `
          <img src="${club.logo}" alt="${club.name}">
          <div class="club-name">${club.name}</div>
          <div class="details">${detailsHtml}</div>
        `;

        container.appendChild(clubCard);
      });
    }

    function filterClubs() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = clubsData.filter(club => club.name.toLowerCase().includes(query));
      renderClubs(filtered);
    }

    function openModal(club) {
      document.getElementById('mLogo').src = club.logo;
      document.getElementById('mTitle').innerText = club.name;
      document.getElementById('mManager').innerText = club.manager || 'Non attribué';
      document.getElementById('mMonthBadges').innerText = club.monthBadges !== undefined ? club.monthBadges : 0;

      const wins = club.form.filter(r => r === 'V').length;
      const draws = club.form.filter(r => r === 'N').length;
      const losses = club.form.filter(r => r === 'D').length;
      const points = (wins * 3) + (draws * 1);

      document.getElementById('mWins').innerText = wins;
      document.getElementById('mDraws').innerText = draws;
      document.getElementById('mLosses').innerText = losses;
      document.getElementById('mPoints').innerText = points;

      document.getElementById('clubModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('clubModal').classList.remove('active');
    }

    renderClubs();
  </script>

</body>
</html>
